[project]
name = "sqlqb"
version = "0.1.2"
description = "A simple sql query builder"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 999

[tool.ruff.lint]
ignore = ["E501"]  # E501 is the line-too-long rule
